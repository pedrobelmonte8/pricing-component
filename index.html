<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing component</title>
    <link rel="stylesheet" href="./assets/style/styles.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>
  <body>
    <main>
      <h1>Our Pricing</h1>
      <!-- Toggle Switch -->
      <div class="toggle-wrapper">
        <span class="toggle-label">Annually</span>
        <label class="switch">
          <input type="checkbox" id="billing-toggle" checked />
          <span class="slider"></span>
        </label>
        <span class="toggle-label">Monthly</span>
      </div>
      <div class="cards">
        <div class="card">
          <h2>Basic</h2>
          <p class="only-mensual">&dollar;19.99</p>
          <p class="only-annual hidden">&dollar;199.99</p>
          <hr />
          <p>500 GB Storage</p>
          <hr />
          <p>2 Users Allowed</p>
          <hr />
          <p>Send up to 3 GB</p>
          <hr />
          <button>Learn More</button>
        </div>
        <div class="card">
          <h2>Professional</h2>
          <p class="only-mensual">&dollar;24.99</p>
          <p class="only-annual hidden">&dollar;249.99</p>
          <hr />
          <p>1 TB Storage</p>
          <hr />
          <p>5 Users Allowed</p>
          <hr />
          <p>Send up to 10 GB</p>
          <hr />
          <button>Learn More</button>
        </div>
        <div class="card">
          <h2>Master</h2>
          <p class="only-mensual">&dollar;39.99</p>
          <p class="only-annual hidden">&dollar;399.99</p>
          <hr />
          <p>2 TB Storage</p>
          <hr />
          <p>10 Users Allowed</p>
          <hr />
          <p>Send up to 20 GB</p>
          <hr />
          <button>Learn More</button>
        </div>
      </div>
    </main>
  </body>
</html>

<script src="./assets/scripts/script.js"></script>
